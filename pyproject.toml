[project]
name = "sleuth"
version = "0.1.0"
description = "A data-analyst agent that, when given a messy CSV, can profile data, plan investigations, write and run pandas code, verify its work, and develop an insights report."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
sleuth = "sleuth:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
